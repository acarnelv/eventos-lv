<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda del Fòrum Futur Municipal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  body{font-family:'Roboto',Arial,sans-serif;color:#000;}
  .wrap{max-width:800px;margin:0 auto;padding:10px 10px 8px;box-sizing:border-box;}
  h1{font-size:22px;font-weight:700;margin:0 0 8px;line-height:1.2;}
  .sub{font-size:15px;margin:0 0 14px;}
  .sub .sep{color:#999;}
  table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.4;}
  td{vertical-align:top;padding:8px 10px;border-bottom:1px solid #ddd;}
  tr:first-child td{border-top:1px solid #333;}
  tr:last-child td{border-bottom:1px solid #333;}
  tr:nth-child(even) td{background:#f4f4f4;}
  td.h{width:88px;white-space:nowrap;border-right:1px solid #333;}
  .notes{font-size:12px;margin:12px 0 0;}
  @media (max-width:480px){
    h1{font-size:19px;}
    .sub{font-size:13px;}
    table{font-size:12.5px;}
    td{padding:7px 6px;}
    td.h{width:62px;white-space:normal;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Agenda del <i>Fòrum Futur Municipal</i></h1>
  <p class="sub">1 de diciembre de 2026 <span class="sep">|</span> De 8.45 h a 14.35 h</p>
  <table><tbody id="agenda"></tbody></table>
  <p class="notes">Agenda sujeta a cambios.</p>
</div>

<script>
/* ====== DATOS DE LA AGENDA ======
   Para cambiar algo, solo hay que tocar esta lista: ["hora", "texto"].
   En el texto: **negrita**, *cursiva*, y "\n" para saltar de línea. */
const AGENDA = [
  ["08:45 - 09:15", "**Recepción de invitados y café de bienvenida**"],
  ["09:15 - 09:30", "**Presentación y bienvenida institucional**\nA cargo de **Cristina Puig** y **Jordi Juan**, director de *La Vanguardia*"],
  ["09:30 - 09:50", "**Conferencia inaugural**\nA cargo de **Joan Clos**, exdirector de ONU-Hábitat, exministro y exalcalde de Barcelona"],
  ["09:50 - 09:55", "**Bloque 1.** Movilidad. Introducción\nA cargo de **Meritxell Budó**, presidenta de la ACM"],
  ["09:55 - 10:30", "**Bloque 1.** Movilidad. Mesa redonda\n**Lluc Salellas i Vilar**, alcalde de Girona\n**Adrià Lamelas Martínez**, alcalde de Lloret de Mar\n**David Quirós Brito**, alcalde de L'Hospitalet de Llobregat\nModera: **David Guerrero**"],
  ["10:30 - 10:35", "**Bloque 2.** Seguridad. Introducción\nA cargo de **Xavier García Albiol**, alcalde de Badalona"],
  ["10:35 - 11:10", "**Bloque 2.** Seguridad. Mesa redonda\n**Fèlix Larrosa Piqué**, alcalde de Lleida\n**Marc Aloy Guàrdia**, alcalde de Manresa\n**Marta Farrés Falgueras**, alcaldesa de Sabadell\n**Filo Cañete**, alcaldesa de Sant Adrià de Besòs\nModera: **Toni Muñoz**"],
  ["11:10 - 11:50", "**Pausa.** Café networking"],
  ["11:50 - 12:00", "**Bloque 3.** Vivienda. Ponencia institucional\nA cargo de **Jaume Collboni**, alcalde de Barcelona"],
  ["12:00 - 12:05", "**Bloque 3.** Vivienda. Introducción\nA cargo de **David Bote**, alcalde de Mataró y presidente de la FMC"],
  ["12:05 - 12:40", "**Bloque 3.** Vivienda. Mesa redonda\n**Pere Granados**, alcalde de Salou\n**Rubén Viñuales Elías**, alcalde de Tarragona\n**Mireia González Sáez**, alcaldesa de Santa Coloma de Gramenet\n**Olga Morales**, alcaldesa de Viladecans\nModera: **Xavi Bundó**"],
  ["12:40 - 12:55", "**Bloque 4.** Colaboración público-privada. Ponencia empresarial: la visión empresarial ante los retos de la ciudad y la vivienda\nA cargo de **Carles Sala**, vicesecretario general técnico de la APCE"],
  ["12:55 - 13:25", "**Bloque 4.** Colaboración público-privada. Mesa I: la ciudad que queremos: movilidad, espacio público y calidad de vida\n**Mateu Homs**, director ejecutivo de Benito\n**Josep Maria Martí**, presidente de Moventia\n**Felipe Campos**, consejero delegado de Aigües de Barcelona\n**Marta Ciurana Paradeda**, directora general de GBI Paprec\nModera: **Mireia Garolera**"],
  ["13:25 - 13:55", "**Bloque 4.** Colaboración público-privada. Mesa II: el futuro de los servicios urbanos: agua, circularidad y sostenibilidad\n**Xavier Balagué**, responsable de Relaciones con Administraciones Locales y Regionales en Catalunya de Ecoembes\n**Jordi Ferrando Cuadradas**, director de la Zona Nordeste de FCC Medio Ambiente\n**Fermín Gómez Esteban**, director de Copisa Integra\nModera: **Sara Sans**"],
  ["13:55 - 14:05", "**Bloque 5.** Representación municipal. Ponencia en representación de los grandes municipios\nA cargo de **Antonio Balmón**, vicepresidente ejecutivo del AMB y alcalde de Cornellà de Llobregat"],
  ["14:05 - 14:15", "**Bloque 5.** Representación municipal. Ponencia en representación de 540 pequeños municipios\nA cargo de **Jaume Gilabert**, alcalde de Montgai"],
  ["14:15 - 14:25", "**Bloque 6.** Entrevista institucional\nCon **Albert Dalmau**, conseller de la Presidencia de la Generalitat de Catalunya, a cargo de **Enric Sierra**"],
  ["14:25 - 14:30", "**Clausura institucional**\nA cargo de **Albert Dalmau**, conseller de la Presidencia de la Generalitat de Catalunya"],
  ["14:30 - 14:35", "**Clausura de la jornada**\nA cargo de *La Vanguardia*"],
  ["14:35", "**Cóctel networking**"]
];

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/\*(.+?)\*/g,'<i>$1</i>')
  .replace(/\n/g,'<br>');
const tb = document.getElementById('agenda');
AGENDA.forEach(([hora, texto]) => {
  const tr = document.createElement('tr');
  tr.innerHTML = '<td class="h">' + esc(hora) + '</td><td>' + md(texto) + '</td>';
  tb.appendChild(tr);
});
</script>
<!-- Mismo código que usan los iframes de Xalok para ajustar la altura -->
<script src="js/amp-resize.js"></script>
<script src="js/iframeResizer.contentWindow.js"></script>
</body>
</html>
