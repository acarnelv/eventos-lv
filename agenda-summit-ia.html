<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda del Summit IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  body{font-family:'Roboto',Arial,sans-serif;color:#000;}
  .wrap{max-width:800px;margin:0 auto;padding:10px 10px 8px;box-sizing:border-box;}
  h1{font-size:22px;font-weight:700;margin:0 0 8px;line-height:1.2;}
  .sub{font-size:15px;margin:0 0 14px;}
  .sub .sep{color:#999;}
  table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.4;}
  td{vertical-align:top;padding:8px 10px;border-bottom:1px solid #ddd;}
  tr:first-child td{border-top:1px solid #333;}
  tr:last-child td{border-bottom:1px solid #333;}
  tr:nth-child(even) td{background:#f4f4f4;}
  td.h{width:88px;white-space:nowrap;border-right:1px solid #333;}
  .notes{font-size:12px;margin:12px 0 0;}
  @media (max-width:480px){
    h1{font-size:19px;}
    .sub{font-size:13px;}
    table{font-size:12.5px;}
    td{padding:7px 6px;}
    td.h{width:62px;white-space:normal;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Agenda del <i>Summit IA</i></h1>
  <p class="sub">10 noviembre 2026 <span class="sep">|</span> De 9h a 14.30h</p>
  <table><tbody id="agenda"></tbody></table>
  <p class="notes">Agenda sujeta a cambios.</p>
</div>

<script>
/* ====== DATOS DE LA AGENDA ======
   Para cambiar algo, solo hay que tocar esta lista: ["hora", "texto"].
   En el texto: **negrita**, *cursiva*, y "\n" para saltar de línea. */
const AGENDA = [
  ["09:00 - 09:30", "**Recepción y café**"],
  ["09:30 - 09:40", "**Bienvenida institucional**\nA cargo de *La Vanguardia* y **Albert Tort Pugibet**, secretario de Telecomunicaciones y Transformación Digital de la Generalitat de Catalunya"],
  ["09:40 - 09:55", "**Kick-off.** Contexto y visión de la jornada\nA cargo de **Aleix Valls**, curador del Summit IA y CEO de Weartificial"],
  ["09:55 - 10:25", "**Keynote 1.** La visión: hacia dónde va la inteligencia artificial\nA cargo de **María García Gutiérrez**, directora de AI Factory en el área CDO de Telefónica"],
  ["10:25 - 11:05", "**Panel 1.** La próxima ola de innovación y crecimiento. Del hype al impacto: agentes, ecosistemas y creación de valor para el cliente\n**Daniel Martinez**, SVP y director del Centro Internacional de HP Barcelona y responsable del HP IA Innovation Hub\n**Mireia Garcia Roca**, directora de Transformación e IA de Hinojosa Packaging Group\n**Jordi Esparbe**, manager de Soluciones Tecnológicas e Innovación IT de Naturgy"],
  ["11:05 - 11:35", "**Keynote 2.** Aplicar la IA: de la tecnología al impacto real\nA cargo de **Miguel Ángel Román**, cofundador del Instituto de Inteligencia Artificial (IIA)"],
  ["11:35 - 12:05", "**Pausa.** Café y networking"],
  ["12:05 - 12:45", "**Panel 2.** IA para impulsar la competitividad de las empresas"],
  ["12:45 - 13:00", "**Ponencia institucional.** La estrategia de IA de Catalunya\nA cargo de **Jaume Miralles**, director general de Inteligencia Artificial, Eficiencia y Datos de la Administración de la Generalitat de Catalunya"],
  ["13:00 - 13:15", "**Entrevista exclusiva**\nCon **Toni Durán**, director de Innovación de Abertis"],
  ["13:15 - 13:55", "**Panel 3.** La inteligencia artificial como motor de competitividad de las pymes. De la adopción tecnológica al crecimiento empresarial: cómo acercar la IA al conjunto del tejido productivo\n**Julián López-Arenas**, director de Competitividad de la Cámara de Comercio de España\n**Ariadna Font-Llitjós**, cofundadora y CEO de Alinia AI\n**Albert Iruela Sánchez**, CEO y cofundador de Omnios"],
  ["13:55 - 14:10", "**Conversación 1:1**\nCon **Alberto López Santamaría**, director de Data & IA - Capacidades Estructurales de Mapfre España"],
  ["14:10 - 14:25", "**Fireside chat de cierre.** La próxima frontera de la IA\nCon **Diego Perino**, director del BSC AI Institut"],
  ["14:25 - 14:30", "**Cierre de la jornada**"],
  ["14:30", "**Cóctel networking**"]
];

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/\*(.+?)\*/g,'<i>$1</i>')
  .replace(/\n/g,'<br>');
const tb = document.getElementById('agenda');
AGENDA.forEach(([hora, texto]) => {
  const tr = document.createElement('tr');
  tr.innerHTML = '<td class="h">' + esc(hora) + '</td><td>' + md(texto) + '</td>';
  tb.appendChild(tr);
});
</script>
<!-- Mismo código que usan los iframes de Xalok para ajustar la altura -->
<script src="js/iframeResizer.contentWindow.js"></script>
</body>
</html>
